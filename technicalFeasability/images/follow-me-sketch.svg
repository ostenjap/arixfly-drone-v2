<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
  <title>Top view: a drone follows a walking person and every camera position adds to the 3D map</title>
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="448" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Ground -->
  <rect x="20" y="20" width="720" height="330" rx="18" fill="#eef6ea" stroke="#bcd8b3" stroke-width="2"/>
  <text x="38" y="44" font-size="12.5" font-weight="700" fill="#59636e">TOP VIEW</text>

  <!-- Things in the world -->
  <rect x="110" y="50" width="130" height="64" rx="6" fill="#d0d7de" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#59636e">building</text>
  <circle cx="330" cy="75" r="18" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="520" cy="68" r="21" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="650" cy="118" r="16" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="110" cy="300" r="18" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="300" cy="316" r="16" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="470" cy="322" r="21" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <circle cx="660" cy="300" r="18" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <rect x="540" y="150" width="70" height="28" rx="5" fill="#d0d7de" stroke="#8c959f" stroke-width="2"/>
  <text x="575" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#59636e">fence</text>

  <!-- Walk path (green) and drone path (blue) -->
  <path d="M60,250 Q200,130 340,230 T620,230" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round"/>
  <path d="M60,215 Q200,95 340,195 T560,245" fill="none" stroke="#0969da" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/>

  <!-- Camera views (cones) and camera spots -->
  <polygon points="130,169 176,149 176,189" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="200,150 246,130 246,170" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="270,159 316,139 316,179" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="406,236 452,216 452,256" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <polygon points="465,257 511,237 511,277" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="130" cy="169" r="5" fill="#0969da"/>
  <circle cx="200" cy="150" r="5" fill="#0969da"/>
  <circle cx="270" cy="159" r="5" fill="#0969da"/>
  <circle cx="406" cy="236" r="5" fill="#0969da"/>
  <circle cx="465" cy="257" r="5" fill="#0969da"/>

  <!-- Drone -->
  <line x1="550" y1="236" x2="570" y2="254" stroke="#1f2328" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="570" y1="236" x2="550" y2="254" stroke="#1f2328" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="550" cy="236" r="7" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
  <circle cx="570" cy="236" r="7" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
  <circle cx="550" cy="254" r="7" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
  <circle cx="570" cy="254" r="7" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
  <rect x="554" y="240" width="12" height="12" rx="3" fill="#0969da"/>
  <text x="552" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">drone follows</text>

  <!-- Person -->
  <circle cx="620" cy="230" r="10" fill="#f0883e" stroke="#bc4c00" stroke-width="2.5"/>
  <text x="640" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">you</text>
  <line x1="634" y1="230" x2="696" y2="230" stroke="#1a7f37" stroke-width="5" marker-end="url(#ag)"/>

  <!-- Legend -->
  <line x1="36" y1="378" x2="66" y2="378" stroke="#1a7f37" stroke-width="5" stroke-linecap="round"/>
  <text x="76" y="383" font-size="13.5" fill="#1f2328">Your walk. The person moves in every frame, so the software has to hide you.</text>
  <polygon points="36,402 66,392 66,412" fill="#0969da" fill-opacity="0.18" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="36" cy="402" r="4" fill="#0969da"/>
  <text x="76" y="407" font-size="13.5" fill="#1f2328">Where the camera looked. Each view adds to the 3D map.</text>
  <text x="36" y="436" font-size="13.5" font-weight="600" fill="#59636e">The map is best close to the walk. Far to the sides, it stays thin.</text>
</svg>
