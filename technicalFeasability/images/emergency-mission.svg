<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
  <title>Emergency drone mission in five steps plus an always-on safety layer: pull out, take off, get position, send SOS, show the way</title>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6e7781"/></marker>
  </defs>
  <rect x="1" y="1" width="773" height="408" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="20" y="20" width="225" height="150" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <circle cx="44" cy="46" r="14" fill="#0969da"/><text x="44" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  <text x="66" y="51" font-size="15" font-weight="700" fill="#1f2328">Pull out</text>
  <text x="34" y="82" font-size="13" fill="#1f2328">Pull the tab. The drone</text>
  <text x="34" y="100" font-size="13" fill="#1f2328">wakes up and checks its</text>
  <text x="34" y="118" font-size="13" fill="#1f2328">battery and propellers.</text>
  <rect x="34" y="132" width="60" height="24" rx="12" fill="#0969da"/>
  <text x="64" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">YOU</text>

  <rect x="275" y="20" width="225" height="150" rx="12" fill="#effaf2" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="299" cy="46" r="14" fill="#1a7f37"/><text x="299" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  <text x="321" y="51" font-size="15" font-weight="700" fill="#1f2328">Take off</text>
  <text x="289" y="82" font-size="13" fill="#1f2328">Rises by itself to a safe</text>
  <text x="289" y="100" font-size="13" fill="#1f2328">height, in the open and</text>
  <text x="289" y="118" font-size="13" fill="#1f2328">away from trees and people.</text>
  <rect x="289" y="132" width="60" height="24" rx="12" fill="#1a7f37"/>
  <text x="319" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AUTO</text>

  <rect x="530" y="20" width="225" height="150" rx="12" fill="#effaf2" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="554" cy="46" r="14" fill="#1a7f37"/><text x="554" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  <text x="576" y="51" font-size="15" font-weight="700" fill="#1f2328">Get position</text>
  <text x="544" y="82" font-size="13" fill="#1f2328">Finds a GPS fix, then tries</text>
  <text x="544" y="100" font-size="13" fill="#1f2328">the mobile network and, if</text>
  <text x="544" y="118" font-size="13" fill="#1f2328">it has one, a satellite.</text>
  <rect x="544" y="132" width="60" height="24" rx="12" fill="#1a7f37"/>
  <text x="574" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AUTO</text>

  <line x1="248" y1="95" x2="272" y2="95" stroke="#6e7781" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="503" y1="95" x2="527" y2="95" stroke="#6e7781" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M642,174 V192 H132 V210" fill="none" stroke="#6e7781" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Row 2 -->
  <rect x="20" y="214" width="225" height="150" rx="12" fill="#effaf2" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="44" cy="240" r="14" fill="#1a7f37"/><text x="44" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
  <text x="66" y="245" font-size="15" font-weight="700" fill="#1f2328">Send SOS</text>
  <text x="34" y="276" font-size="13" fill="#1f2328">Sends your location and a</text>
  <text x="34" y="294" font-size="13" fill="#1f2328">short note to 112 or your</text>
  <text x="34" y="312" font-size="13" fill="#1f2328">contacts, and confirms.</text>
  <rect x="34" y="326" width="60" height="24" rx="12" fill="#1a7f37"/>
  <text x="64" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AUTO</text>

  <rect x="275" y="214" width="225" height="150" rx="12" fill="#effaf2" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="299" cy="240" r="14" fill="#1a7f37"/><text x="299" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
  <text x="321" y="245" font-size="15" font-weight="700" fill="#1f2328">Show the way</text>
  <text x="289" y="276" font-size="13" fill="#1f2328">Shows direction and distance</text>
  <text x="289" y="294" font-size="13" fill="#1f2328">to the nearest hospital. Light</text>
  <text x="289" y="312" font-size="13" fill="#1f2328">and buzzer guide rescuers.</text>
  <rect x="289" y="326" width="60" height="24" rx="12" fill="#1a7f37"/>
  <text x="319" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AUTO</text>

  <rect x="530" y="214" width="225" height="150" rx="12" fill="#fff8e1" stroke="#9a6700" stroke-width="2.5"/>
  <circle cx="554" cy="240" r="14" fill="#9a6700"/><text x="554" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">!</text>
  <text x="576" y="245" font-size="15" font-weight="700" fill="#1f2328">Safety rules</text>
  <text x="544" y="276" font-size="13" fill="#1f2328">Always on: battery reserve,</text>
  <text x="544" y="294" font-size="13" fill="#1f2328">wind limit, fence, never over</text>
  <text x="544" y="312" font-size="13" fill="#1f2328">people, land away from you.</text>
  <rect x="544" y="326" width="92" height="24" rx="12" fill="#9a6700"/>
  <text x="590" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ALWAYS ON</text>

  <line x1="248" y1="289" x2="272" y2="289" stroke="#6e7781" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="503" y1="289" x2="527" y2="289" stroke="#9a6700" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <text x="20" y="390" font-size="12.5" fill="#59636e">After the pull the person does nothing. The safety rules watch steps 2 to 5 and can end the flight at any moment.</text>
</svg>
