<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
  <title>An emergency drone pulled from a med kit rises, sends an SOS with the location, and shows the way to the nearest hospital</title>
  <defs>
    <clipPath id="sc"><rect x="20" y="20" width="720" height="330" rx="18"/></clipPath>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0969da"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1a7f37"/></marker>
    <marker id="ad" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#59636e"/></marker>
    <marker id="al" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#59636e"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="438" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <g clip-path="url(#sc)">
    <rect x="20" y="20" width="720" height="330" fill="#eaf5fd"/>
    <path d="M20,296 C150,240 260,300 400,284 S640,250 740,286 L740,350 L20,350 Z" fill="#cfe8c4"/>
  </g>
  <rect x="20" y="20" width="720" height="330" rx="18" fill="none" stroke="#b6d9ee" stroke-width="2"/>

  <!-- Trees -->
  <rect x="64" y="264" width="8" height="26" fill="#8a6a3b"/><circle cx="68" cy="250" r="22" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>
  <rect x="474" y="268" width="8" height="24" fill="#8a6a3b"/><circle cx="478" cy="255" r="19" fill="#8fcf9a" stroke="#3d8b4f" stroke-width="2"/>

  <!-- Person on the ground -->
  <circle cx="122" cy="318" r="8" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <rect x="130" y="312" width="64" height="14" rx="7" fill="#f0883e" stroke="#bc4c00" stroke-width="2"/>
  <text x="158" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">you</text>

  <!-- Med kit -->
  <rect x="212" y="298" width="56" height="34" rx="5" fill="#ffffff" stroke="#cf222e" stroke-width="2.5"/>
  <rect x="236" y="303" width="8" height="24" fill="#cf222e"/><rect x="228" y="311" width="24" height="8" fill="#cf222e"/>
  <text x="240" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#cf222e">med kit</text>

  <!-- Takeoff path -->
  <path d="M268,300 Q320,230 322,138" fill="none" stroke="#59636e" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#ad)"/>

  <!-- Drone with strobe -->
  <g stroke="#e8970c" stroke-width="3" stroke-linecap="round">
    <line x1="330" y1="88" x2="330" y2="76"/><line x1="314" y1="92" x2="306" y2="82"/><line x1="346" y1="92" x2="354" y2="82"/>
    <line x1="300" y1="104" x2="290" y2="100"/><line x1="360" y1="104" x2="370" y2="100"/>
  </g>
  <line x1="306" y1="108" x2="324" y2="108" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <line x1="336" y1="108" x2="354" y2="108" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <rect x="304" y="114" width="52" height="14" rx="6" fill="#0969da"/>
  <circle cx="330" cy="121" r="3" fill="#e8970c"/>
  <text x="330" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0b3d91">emergency drone</text>

  <!-- Height dimension -->
  <line x1="398" y1="136" x2="398" y2="294" stroke="#59636e" stroke-width="2.5" marker-start="url(#al)" marker-end="url(#ad)"/>
  <text x="408" y="212" font-size="12.5" font-weight="700" fill="#59636e">30 to 60 m up</text>
  <text x="408" y="229" font-size="12.5" fill="#59636e">(our guess)</text>

  <!-- SOS to the mobile network -->
  <line x1="362" y1="112" x2="540" y2="112" stroke="#0969da" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ab)"/>
  <text x="451" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b3d91">SOS with your location</text>
  <text x="451" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b3d91">and a short medical note</text>

  <!-- Mobile tower -->
  <polygon points="534,296 578,296 556,120" fill="none" stroke="#59636e" stroke-width="3" stroke-linejoin="round"/>
  <line x1="542" y1="262" x2="570" y2="262" stroke="#59636e" stroke-width="2.5"/>
  <line x1="548" y1="214" x2="564" y2="214" stroke="#59636e" stroke-width="2.5"/>
  <circle cx="556" cy="114" r="5" fill="#0969da"/>
  <text x="556" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#59636e">mobile network</text>

  <!-- Satellite -->
  <rect x="684" y="62" width="14" height="10" fill="#6e7781"/>
  <rect x="664" y="64" width="16" height="6" fill="#8cc7e6" stroke="#0969da" stroke-width="1"/>
  <rect x="702" y="64" width="16" height="6" fill="#8cc7e6" stroke="#0969da" stroke-width="1"/>
  <text x="691" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#59636e">or satellite</text>

  <!-- Hospital -->
  <rect x="632" y="250" width="62" height="46" rx="4" fill="#ffffff" stroke="#6e7781" stroke-width="2.5"/>
  <rect x="659" y="256" width="8" height="24" fill="#cf222e"/><rect x="651" y="264" width="24" height="8" fill="#cf222e"/>
  <text x="663" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">nearest hospital</text>
  <text x="663" y="316" text-anchor="middle" font-size="12.5" fill="#1f2328">3.2 km (example)</text>

  <!-- Way to the hospital -->
  <line x1="204" y1="341" x2="624" y2="341" stroke="#1a7f37" stroke-width="3.5" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ag)"/>
  <text x="414" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a7f37">direction and distance shown on the screen</text>

  <!-- Legend -->
  <text x="30" y="378" font-size="13.5" fill="#1f2328">The drone climbs, finds your position and sends it to emergency services (112 in Germany).</text>
  <text x="30" y="402" font-size="13.5" font-weight="600" fill="#59636e">It shows the way to the nearest hospital and flashes a light so rescuers can find you.</text>
  <text x="30" y="426" font-size="13.5" font-weight="600" fill="#cf222e">It does not replace calling 112 or first aid. It helps when you cannot call, or cannot be found.</text>
</svg>
