<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
  <title>A drone orbits a person taking photos, the app checks coverage, and AI builds a 3D view you can spin and share with friends</title>
  <defs>
    <clipPath id="sc"><rect x="20" y="20" width="380" height="330" rx="18"/></clipPath>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8250df"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="438" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Scene panel -->
  <g clip-path="url(#sc)">
    <rect x="20" y="20" width="380" height="330" fill="#eaf5fd"/>
    <rect x="20" y="292" width="380" height="58" fill="#cfe8c4"/>
  </g>
  <rect x="20" y="20" width="380" height="330" rx="18" fill="none" stroke="#b6d9ee" stroke-width="2"/>

  <!-- Orbit, back half -->
  <path d="M135,262 A110,28 0 0 1 355,262" fill="none" stroke="#0969da" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="167" cy="242" r="4.5" fill="#0969da"/><circle cx="245" cy="234" r="4.5" fill="#0969da"/><circle cx="323" cy="242" r="4.5" fill="#0969da"/>

  <!-- Person standing -->
  <circle cx="245" cy="196" r="13" fill="#f0b48a" stroke="#b9774d" stroke-width="2"/>
  <rect x="231" y="212" width="28" height="42" rx="8" fill="#1a7f37" stroke="#14602a" stroke-width="2"/>
  <line x1="231" y1="220" x2="219" y2="246" stroke="#1a7f37" stroke-width="7" stroke-linecap="round"/>
  <line x1="259" y1="220" x2="271" y2="246" stroke="#1a7f37" stroke-width="7" stroke-linecap="round"/>
  <rect x="233" y="252" width="11" height="40" rx="4" fill="#1f2328"/>
  <rect x="246" y="252" width="11" height="40" rx="4" fill="#1f2328"/>
  <text x="245" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#14602a">someone</text>

  <!-- Orbit, front half -->
  <path d="M355,262 A110,28 0 0 1 135,262" fill="none" stroke="#0969da" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="323" cy="282" r="4.5" fill="#0969da"/><circle cx="245" cy="290" r="4.5" fill="#0969da"/><circle cx="167" cy="282" r="4.5" fill="#0969da"/><circle cx="135" cy="262" r="4.5" fill="#0969da"/>

  <!-- Drone with view cone -->
  <polygon points="344,232 266,196 266,268" fill="#0969da" fill-opacity="0.16" stroke="#0969da" stroke-width="1.5"/>
  <line x1="346" y1="218" x2="368" y2="218" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <line x1="357" y1="218" x2="357" y2="225" stroke="#1f2328" stroke-width="3"/>
  <rect x="340" y="224" width="46" height="12" rx="5" fill="#0969da"/>
  <text x="363" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">drone</text>
  <text x="210" y="334" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b3d91">photos from all around the person</text>

  <!-- Coverage check inset -->
  <circle cx="70" cy="92" r="34" fill="#ffffff" fill-opacity="0.75" stroke="#1a7f37" stroke-width="8"/>
  <path d="M50.5,64.1 A34,34 0 0 1 89.5,64.1" fill="none" stroke="#cf222e" stroke-width="8"/>
  <circle cx="70" cy="86" r="5" fill="#f0b48a" stroke="#b9774d" stroke-width="1.5"/>
  <rect x="64" y="92" width="12" height="12" rx="4" fill="#1a7f37"/>
  <text x="70" y="42" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">coverage check</text>
  <text x="70" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">missing: their back</text>

  <!-- Arrow to the 3D view -->
  <line x1="404" y1="186" x2="458" y2="186" stroke="#8250df" stroke-width="4" marker-end="url(#ab)"/>
  <text x="431" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#8250df">AI</text>

  <!-- Screen with the 3D view -->
  <rect x="462" y="48" width="278" height="262" rx="16" fill="#1f2328"/>
  <rect x="472" y="58" width="258" height="242" rx="10" fill="#f6f8fa"/>
  <text x="601" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">3D view</text>
  <ellipse cx="601" cy="196" rx="96" ry="22" fill="none" stroke="#8250df" stroke-width="2.5" stroke-dasharray="5 5"/>
  <polygon points="710,196 698,190 698,202" fill="#8250df"/>
  <!-- person in the 3D view -->
  <circle cx="601" cy="120" r="14" fill="#f0b48a"/>
  <rect x="585" y="137" width="32" height="46" rx="9" fill="#1a7f37"/>
  <line x1="585" y1="146" x2="572" y2="176" stroke="#1a7f37" stroke-width="8" stroke-linecap="round"/>
  <line x1="617" y1="146" x2="630" y2="176" stroke="#1a7f37" stroke-width="8" stroke-linecap="round"/>
  <rect x="587" y="182" width="12" height="38" rx="4" fill="#1f2328"/>
  <rect x="603" y="182" width="12" height="38" rx="4" fill="#1f2328"/>
  <g fill-opacity="0.5">
    <ellipse cx="596" cy="116" rx="8" ry="5" fill="#f5d0b3" transform="rotate(-25 596 116)"/>
    <ellipse cx="607" cy="124" rx="8" ry="5" fill="#d99a6e" transform="rotate(30 607 124)"/>
    <ellipse cx="593" cy="150" rx="9" ry="5" fill="#6cc687" transform="rotate(-20 593 150)"/>
    <ellipse cx="610" cy="160" rx="9" ry="5" fill="#14602a" transform="rotate(25 610 160)"/>
    <ellipse cx="601" cy="176" rx="10" ry="5" fill="#6cc687"/>
    <ellipse cx="574" cy="164" rx="7" ry="4.5" fill="#6cc687" transform="rotate(60 574 164)"/>
    <ellipse cx="628" cy="164" rx="7" ry="4.5" fill="#14602a" transform="rotate(-60 628 164)"/>
    <ellipse cx="593" cy="204" rx="8" ry="5" fill="#4b525c"/>
    <ellipse cx="609" cy="206" rx="8" ry="5" fill="#2c3138"/>
    <ellipse cx="601" cy="218" rx="14" ry="5" fill="#b8c2cc"/>
  </g>
  <!-- The whole trip as a route -->
  <polyline points="488,238 520,230 552,240 584,230 616,240 648,230 680,240 710,232" fill="none" stroke="#1a7f37" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
  <circle cx="488" cy="238" r="4.5" fill="#1a7f37"/>
  <line x1="712" y1="232" x2="712" y2="218" stroke="#1a7f37" stroke-width="2.5"/>
  <polygon points="712,218 724,222 712,226" fill="#cf222e"/>
  <rect x="486" y="252" width="90" height="28" rx="14" fill="#8250df"/>
  <text x="531" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">spin</text>
  <rect x="590" y="252" width="126" height="28" rx="14" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="653" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8250df">share with friends</text>
  <text x="601" y="334" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8250df">a "splat" of the scene, plus the whole trip as a route</text>

  <!-- Legend -->
  <text x="30" y="378" font-size="13.5" fill="#1f2328">The app plans the flight so the photos overlap enough, then checks the coverage before the drone lands.</text>
  <text x="30" y="402" font-size="13.5" font-weight="600" fill="#59636e">AI turns the photos into a 3D view you can spin and share with friends as a link.</text>
  <text x="30" y="426" font-size="13.5" font-weight="600" fill="#cf222e">For fun only. Friends who get the link can watch the whole trip in 3D.</text>
</svg>
